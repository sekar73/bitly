# Docker DNS is resolved dynamically so independent container replacements recover.
map $request_method $link_backend {
    GET read:8000;
    HEAD read:8000;
    default write:8000;
}
server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=5s ipv6=off;
    root /usr/share/nginx/html;
    client_max_body_size 16k;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health { set $backend read:8000; proxy_pass http://$backend; }
    location = /health/read { set $backend read:8000; proxy_pass http://$backend/health; }
    location = /health/write { set $backend write:8000; proxy_pass http://$backend/health; }
    location /api/auth/ { set $backend write:8000; proxy_pass http://$backend; }
    location = /api/links { proxy_pass http://$link_backend; }
    location /api/links/ { proxy_pass http://$link_backend; }
    location /s/ { set $backend read:8000; proxy_pass http://$backend; }
    location /read/ { set $backend read:8000; proxy_pass http://$backend; }
    location /write/ { set $backend write:8000; proxy_pass http://$backend; }
    location = /docs {
        default_type text/html;
        return 200 '<html><head><title>Bitly API documentation</title></head><body><h1>API services</h1><p><a href="/read/docs">Read service API</a></p><p><a href="/write/docs">Write service and authentication API</a></p></body></html>';
    }
    location = / { try_files /index.html =404; }
    location /static/ { try_files $uri =404; }
    location / { return 404; }
}
